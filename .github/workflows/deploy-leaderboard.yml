# Tests the leaderboard server, then deploys it to Cloudflare (Worker + D1 database).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Leaderboard

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'AirLabs/TrainerCore.h'
      - 'tools/dump_core.cpp'
      - '.github/workflows/deploy-leaderboard.yml'
  workflow_dispatch:

concurrency:
  group: leaderboard-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Server's presets and rank marks match the plugin's
        run: |
          g++ -std=c++20 -O1 -IAirLabs tools/dump_core.cpp -o /tmp/dump_core
          /tmp/dump_core > /tmp/core-data.js
          diff -u server/src/core-data.js /tmp/core-data.js || { echo "::error::server/src/core-data.js is out of date: rebuild it with tools/dump_core.cpp"; exit 1; }
      - name: Tests
        working-directory: server
        run: node --no-warnings --test test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Repository secrets. (The CLOUDFARE_ spellings are the names they were saved under.)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the secrets are there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets: repo Settings > Secrets and variables > Actions > Secrets tab > Repository secrets."
            exit 1
          fi
      - name: Find (or create) the D1 database
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          resp=$(curl -sS -H "$auth" "$api?name=airlabs-leaderboard")
          echo "$resp" | jq -e '.success' > /dev/null || { echo "::error::Cloudflare said: $(echo "$resp" | jq -c '.errors')"; exit 1; }
          id=$(echo "$resp" | jq -r '.result[]? | select(.name == "airlabs-leaderboard") | .uuid' | head -n1)
          if [ -z "$id" ]; then
            resp=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" -d '{"name":"airlabs-leaderboard"}' "$api")
            echo "$resp" | jq -e '.success' > /dev/null || { echo "::error::Couldn't create the database: $(echo "$resp" | jq -c '.errors')"; exit 1; }
            id=$(echo "$resp" | jq -r '.result.uuid')
            echo "Created the D1 database"
          fi
          echo "D1 database id: $id"
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml
      - name: Install wrangler
        run: npm install --no-audit --no-fund
      - name: Update the database tables
        run: npx wrangler d1 migrations apply airlabs-leaderboard --remote
      - name: Deploy the Worker
        run: npx wrangler deploy
      - name: Check it answers
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://leaderboard.airlabs.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          echo "::error::The Worker deployed but doesn't answer yet at leaderboard.airlabs.workers.dev"
          exit 1
